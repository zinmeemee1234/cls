<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration App</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Student Registration</h1>
        <p>Register students and browse the student list.</p>
      </header>

      <section class="card">
        <h2>Register a Student</h2>
        <form id="student-form">
          <div class="form-group">
            <label for="name">Student Name</label>
            <input type="text" id="name" name="name" maxlength="100" required />
          </div>
          <div class="form-group">
            <label for="age">Age</label>
            <input
              type="number"
              id="age"
              name="age"
              min="1"
              max="120"
              required
            />
          </div>
          <button type="submit" id="submit-button">Register Student</button>
        </form>
        <p id="message" role="status"></p>
      </section>

      <section class="card">
        <div class="list-heading">
          <div>
            <h2>Student List</h2>
            <p id="list-summary">Loading students...</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Registered At</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <tr>
                <td colspan="4" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav
          id="pagination"
          class="pagination"
          aria-label="Student list pages"
        ></nav>
      </section>
    </main>
  </body>
</html>
